  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

.61,.36,1),border-color .5s ease}\n.mx-card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.2)}\n.mx-card-num{font-family:'Archivo',Helvetica,sans-serif;font-weight:500;font-size:13px;letter-spacing:.18em;color:rgba(255,255,255,.55)}\n.mx-card-title{font-family:'Archivo',Helvetica,sans-serif;font-weight:600;font-size:22px;line-height:1.3}\n.mx-card-desc{font-size:15px;line-height:1.75;color:rgba(255,255,255,.75)}\n\n/* ============ Clients marquee ============ */\n.mx-marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}\n.mx-track{display:flex;gap:20px;width:max-content;animation:mx-scroll 45s linear infinite}\n.mx-marquee:hover .mx-track{animation-play-state:paused}\n@keyframes mx-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n.mx-client{width:280px;flex-shrink:0;background:#000;border:1px solid rgba(255,255,255,.12);padding:14px;display:flex;flex-direction:column;gap:18px;transition:border-color .4s ease}\n.mx-client:hover{border-color:rgba(255,255,255,.2)}\n.mx-client-img{height:320px;background:#000;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;overflow:hidden}\n.mx-client-img img{width:100%;height:100%;object-fit:cover;display:block}\n.mx-client-img span{font-family:monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}\n.mx-client-meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 6px 8px}\n.mx-client-name{font-family:'Archivo',Helvetica,sans-serif;font-weight:600;font-size:16px}\n.mx-client-tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}\n\n/* ============ Operating model ============ */\n.mx-op-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}\n.mx-op-card{background:#111;border:1px solid rgba(255,255,255,.12);padding:48px 40px}\n.mx-op-card h3{font-family:'Archivo',Helvetica,sans-serif;font-weight:600;font-size:24px;margin:0 0 20px;color:#fff}\n.mx-op-card p{font-size:15px;line-height:1.75;color:rgba(255,255,255,.75);margin:0 0 36px}\n.mx-bullet{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid rgba(255,255,255,.12);font-size:15px;color:rgba(255,255,255,.9)}\n.mx-bullet::before{content:\"\";width:5px;height:5px;background:#fff;flex-shrink:0}\n.mx-step{display:flex;align-items:center;gap:28px;padding:30px 8px;border-bottom:1px solid rgba(255,255,255,.12);transition:padding-left .45s cubic-bezier(.22,.61,.36,1)}\n.mx-step:hover{padding-left:20px}\n.mx-step-num{font-family:'Archivo',Helvetica,sans-serif;font-weight:500;font-size:14px;letter-spacing:.14em;color:rgba(255,255,255,.55)}\n.mx-step-name{font-family:'Archivo',Helvetica,sans-serif;font-weight:600;font-size:clamp(22px,2.4vw,32px)}\n\n/* ============ CTA + Footer ============ */\n.mx-cta{text-align:center}\n.mx-cta .mx-h2{max-width:18ch;margin-left:auto;margin-right:auto;font-size:clamp(32px,4.4vw,60px);margin-bottom:28px;text-wrap:balance}\n.mx-cta .mx-lead{margin-left:auto;margin-right:auto;max-width:640px;margin-bottom:48px}\n.mx-cta .mx-btn-row{justify-content:center}\n.mx-footer{padding:60px 0;display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}\n.mx-footer-line{font-size:14px;line-height:1.6;color:rgba(255,255,255,.55)}\n.mx-footer-legal{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.2)}\n\n/* ============ Reveal on scroll ============ */\n.mx-reveal{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.22,.61,.36,1),transform .9s cubic-bezier(.22,.61,.36,1)}\n.mx-reveal.mx-in{opacity:1;transform:translateY(0)}\n@media (prefers-reduced-motion:reduce){.mx-reveal{opacity:1;transform:none;transition:none}.mx-track{animation:none}}\n\n/* ============ Mobile ============ */\n@media (max-width:820px){\n  .mx-nav-links{display:none}\n  .mx-op-grid{grid-template-columns:1fr}\n}\n@media (max-width:640px){\n  .mx-btn-row{flex-direction:column;align-items:stretch}\n  .mx-client{width:240px}\n  .mx-client-img{height:280px}\n}\n<\u002Fstyle>\n\n<style>body{margin:0;background:#000}<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"mx-page\">\n\n  <!-- NAV (static, not fixed) -->\n  <nav class=\"mx-nav\">\n    <div class=\"mx-container mx-nav-inner\">\n      <a href=\"#\"><img src=\"c6a01397-03b0-4d8a-8783-db7f1da54220\" alt=\"MerchEXP\" class=\"mx-logo\"><\u002Fa>\n      <div class=\"mx-nav-links\">\n        <a href=\"#mx-services\">Services<\u002Fa>\n        <a href=\"#mx-clients\">Clients<\u002Fa>\n        <a href=\"#mx-operation\">Operation<\u002Fa>\n      <\u002Fdiv>\n      <a href=\"#mx-cta\" class=\"mx-nav-cta\">Start a Project<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- HERO -->\n  <header class=\"mx-hero\">\n        <div class=\"mx-hero-img\" style=\"background-image:url(&quot;cb9d0ee2-a643-4c49-b28c-e41ec7592e7f&quot;)\"><\u002Fdiv>\n    <div class=\"mx-hero-scrim-x\"><\u002Fdiv>\n    <div class=\"mx-hero-scrim-y\"><\u002Fdiv>\n    <div class=\"mx-hero-grid\"><\u002Fdiv>\n    <div class=\"mx-hero-word\" aria-hidden=\"true\">MERCH EXP<\u002Fdiv>\n    <div class=\"mx-container mx-hero-inner\">\n      <div class=\"mx-eyebrow mx-reveal\" style=\"margin-bottom:32px\">Merchandise Operations — Est. for Culture<\u002Fdiv>\n      <h1 class=\"mx-h mx-h1 mx-reveal\" style=\"margin-bottom:32px\">Merchandising built for artists, tours, and modern commerce.<\u002Fh1>\n      <p class=\"mx-hero-sub mx-reveal\" data-delay=\"120\">MerchEXP helps talent, entertainment brands, and cultural properties turn demand into premium merchandise programs across Shopify, customer service, manufacturing, and full tour operations.<\u002Fp>\n      <div class=\"mx-btn-row mx-reveal\" data-delay=\"220\">\n        <a href=\"#mx-services\" class=\"mx-btn mx-btn-solid\">Explore Services<\u002Fa>\n        <a href=\"#mx-clients\" class=\"mx-btn mx-btn-ghost\">View Clients<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- SERVICES -->\n  <section id=\"mx-services\" class=\"mx-section\">\n    <div class=\"mx-container\">\n      <div class=\"mx-eyebrow mx-reveal\">Services<\u002Fdiv>\n      <h2 class=\"mx-h mx-h2 mx-reveal\">A complete merchandise engine.<\u002Fh2>\n      <p class=\"mx-lead mx-reveal\" data-delay=\"100\">From Shopify operations to customer support, production, and the physical realities of tour merchandise, MerchEXP provides the infrastructure needed to scale official merchandise with control and consistency.<\u002Fp>\n      <div class=\"mx-cards\">\n        <div class=\"mx-card mx-reveal\">\n          <div class=\"mx-card-num\">01<\u002Fdiv>\n          <div class=\"mx-card-title\">Ecommerce Manager / Shopify Expert<\u002Fdiv>\n          <div class=\"mx-card-desc\">Shopify store management, product launches, merchandising, theme improvements, checkout optimization, inventory coordination, reporting, and day-to-day ecommerce execution.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mx-card mx-reveal\" data-delay=\"80\">\n          <div class=\"mx-card-num\">02<\u002Fdiv>\n          <div class=\"mx-card-title\">Customer Service<\u002Fdiv>\n          <div class=\"mx-card-desc\">Fan-facing support for order status, exchanges, returns, delivery questions, product issues, and post-purchase communication that protects the artist’s brand experience.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mx-card mx-reveal\" data-delay=\"160\">\n          <div class=\"mx-card-num\">03<\u002Fdiv>\n          <div class=\"mx-card-title\">Merchandise Manufacturing<\u002Fdiv>\n          <div class=\"mx-card-desc\">Vendor sourcing, production planning, sampling, quality control, packaging coordination, cost management, and replenishment for apparel, accessories, and special drops.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mx-card mx-reveal\" data-delay=\"240\">\n          <div class=\"mx-card-num\">04<\u002Fdiv>\n          <div class=\"mx-card-title\">Tour Merchandising Complete Operation<\u002Fdiv>\n          <div class=\"mx-card-desc\">Inventory planning, venue coordination, staff workflows, point-of-sale support, stock movement, sales reconciliation, settlement, and reporting across tour dates.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CLIENTS -->\n  <section id=\"mx-clients\" class=\"mx-section mx-alt\" style=\"padding-bottom:0\">\n    <div class=\"mx-container\">\n      <div class=\"mx-eyebrow mx-reveal\">Previous Clients<\u002Fdiv>\n      <h2 class=\"mx-h mx-h2 mx-reveal\">Trusted across culture, music, and sport.<\u002Fh2>\n      <p class=\"mx-lead mx-reveal\" data-delay=\"100\">A moving gallery of previous clients and projects across music, sport, and culture.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"mx-marquee mx-reveal\" style=\"padding-bottom:clamp(80px,10vw,140px)\">\n      <div class=\"mx-track\" id=\"mx-track\">\n        <!-- Set 1 (JS duplicates this set for a seamless loop) -->\n        <div class=\"mx-client\"><div class=\"mx-client-img\"><img src=\"264cd9aa-614e-4993-916b-adb5db975ad1\" alt=\"Bad Bunny\" loading=\"lazy\"><\u002Fdiv><div class=\"mx-client-meta\"><span class=\"mx-client-name\">Bad Bunny<\u002Fspan><span class=\"mx-client-tag\">Music<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"mx-client\"><div class=\"mx-client-img\"><img src=\"2de6cbbc-8310-4a86-8bc8-864afd2e858c\" alt=\"Peso Pluma\" loading=\"lazy\"><\u002Fdiv><div class=\"mx-client-meta\"><span class=\"mx-client-name\">Peso Pluma<\u002Fspan><span class=\"mx-client-tag\">Music<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"mx-client\"><div class=\"mx-client-img\"><img src=\"8c98f6fe-f4d2-439c-a1a3-3bbb28bfc50c\" alt=\"Rawayana\" loading=\"lazy\"><\u002Fdiv><div class=\"mx-client-meta\"><span class=\"mx-client-name\">Rawayana<\u002Fspan><span class=\"mx-client-tag\">Music<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"mx-client\"><div class=\"mx-client-img\"><img src=\"3340f881-e454-4b6d-bcea-32982018dd54\" alt=\"Daddy Yankee\" loading=\"lazy\"><\u002Fdiv><div class=\"mx-client-meta\"><span class=\"mx-client-name\">Daddy Yankee<\u002Fspan><span class=\"mx-client-tag\">Music<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"mx-client\"><div class=\"mx-client-img\"><img src=\"0a16d865-751d-4c28-a37a-85e0c4021e86\" alt=\"Roberto Clemente\" loading=\"lazy\"><\u002Fdiv><div class=\"mx-client-meta\"><span class=\"mx-client-name\">Roberto Clemente<\u002Fspan><span class=\"mx-client-tag\">Legacy<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"mx-client\"><div class=\"mx-client-img\"><img src=\"8cf5e68a-6b52-4d57-b51d-3ad94bb59e4e\" alt=\"Adidas para Bad Bunny\" loading=\"lazy\"><\u002Fdiv><div class=\"mx-client-meta\"><span class=\"mx-client-name\">Adidas para Bad Bunny<\u002Fspan><span class=\"mx-client-tag\">Collab<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"mx-client\"><div class=\"mx-client-img\"><img src=\"c7a903a4-c4c8-48e8-92f5-f722b55ed931\" alt=\"El Fanatico\" loading=\"lazy\"><\u002Fdiv><div class=\"mx-client-meta\"><span class=\"mx-client-name\">El Fanatico<\u002Fspan><span class=\"mx-client-tag\">Sport<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- OPERATING MODEL -->\n  <section id=\"mx-operation\" class=\"mx-section\">\n    <div class=\"mx-container\">\n      <div class=\"mx-eyebrow mx-reveal\">Operating Model<\u002Fdiv>\n      <h2 class=\"mx-h mx-h2 mx-reveal\">Built for launches, drops, and live demand.<\u002Fh2>\n      <p class=\"mx-lead mx-reveal\" data-delay=\"100\">Merchandise programs fail when creative, production, ecommerce, fulfillment, and reporting operate separately. MerchEXP brings these functions into one controlled system.<\u002Fp>\n      <div class= ull tour merchandising execution under one professional operating partner.<\u002Fp>\n      <div class=\"mx-btn-row mx-reveal\" data-delay=\"200\">\n        <a href=\"#\" class=\"mx-btn mx-btn-solid\">Contact MerchEXP<\u002Fa>\n        <a href=\"#mx-services\" class=\"mx-btn mx-btn-ghost\">Review Services<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer>\n    <div class=\"mx-container mx-footer\">\n      <img src=\"c6a01397-03b0-4d8a-8783-db7f1da54220\" alt=\"MerchEXP\" class=\"mx-logo\" style=\"height:64px\">\n      <div class=\"mx-footer-line\">Official merchandise infrastructure for artists, tours, and culture brands.<\u002Fdiv>\n      <div class=\"mx-footer-legal\">© 2026 MerchEXP<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<!-- ===== MerchEXP — BODY CODE (paste in Webflow: Project Settings → Custom Code → Before <\u002Fbody>) ===== -->\n<script>\n(function () {\n  // Seamless marquee: duplicate the card set once\n  var track = document.getElementById('mx-track');\n  if (track) {\n    track.innerHTML += track.innerHTML;\n  }\n\n  // Reveal on scroll (soft opacity + translateY)\n  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var els = document.querySelectorAll('.mx-reveal');\n  if (reduce || !('IntersectionObserver' in window)) {\n    els.forEach(function (el) { el.classList.add('mx-in'); });\n    return;\n  }\n  var io = new IntersectionObserver(function (entries) {\n    entries.forEach(function (e) {\n      if (e.isIntersecting) {\n        var d = e.target.getAttribute('data-delay') || 0;\n        e.target.style.transitionDelay = d + 'ms';\n        e.target.classList.add('mx-in');\n        io.unobserve(e.target);\n      }\n    });\n  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n  els.forEach(function (el) { io.observe(el); });\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
